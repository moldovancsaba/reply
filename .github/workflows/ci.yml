name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_trinity_smoke:
        description: "Run the Trinity/Train integration smoke check"
        required: false
        default: false
        type: boolean

jobs:
  chat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./chat

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chat/package-lock.json

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Run foundation verification
        run: npm run verify:foundation -- --skip-swift-build

      - name: Run Trinity/Train smoke check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_trinity_smoke }}
        run: npm run verify:trinity-train

      # reply#34 / reply#31: surface high+ vulns without failing the job until the tree is clean enough to gate.
      - name: npm audit (high; informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  native-app:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chat/package-lock.json

      - name: Install chat dependencies
        working-directory: ./chat
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Build native app foundation target
        working-directory: ./app/reply-app
        run: swift build
