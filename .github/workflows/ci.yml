name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    # macOS: the native helper and the better-sqlite3 build are macOS-first
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: core
      - run: bash helper/build.sh
        working-directory: core
      - run: npm run lint
        working-directory: core
      - run: npm test
        working-directory: core
      - run: node scripts/audit.js
        working-directory: core
  ui:
    # the GDS design system comes from the public npm registry: no token needed
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: core
      - run: npm --prefix ui ci
        working-directory: core
      - run: npx playwright install webkit # Safari's engine for the browser tests
        working-directory: core/ui
      - run: npm --prefix ui run verify
        working-directory: core
